name: Update major tag

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: update-major-tag

jobs:
  update-major-tag:
    name: Update major and minor tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    permissions:
      contents: write # Required to push the moved major/minor tags.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Move major and minor tags
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:?GITHUB_REF_NAME is not set}"
          if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            major="v${BASH_REMATCH[1]}"
            minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            echo "Tag '$tag' is not a release tag; skipping."
            exit 0
          fi

          # Print the highest vX.Y.Z release tag under the given prefix
          # (e.g. "v1" -> v1.*.*, "v1.2" -> v1.2.*).
          latest_release() {
            git tag -l "$1.*" \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V \
              | tail -n 1
          }

          # Only move a floating tag when this release is the newest one it
          # covers, so pushing a backport (e.g. v1.0.1 after v1.1.0) does not
          # roll v1 back to an older release.
          refs=()
          for floating in "$major" "$minor"; do
            latest="$(latest_release "$floating")"
            if [[ "$latest" != "$tag" ]]; then
              echo "Not moving $floating: $tag is older than $latest."
              continue
            fi
            echo "Moving $floating to $tag."
            git update-ref "refs/tags/$floating" "$GITHUB_SHA"
            refs+=("refs/tags/$floating")
          done

          if [[ ${#refs[@]} -gt 0 ]]; then
            git push --force origin "${refs[@]}"
          fi
